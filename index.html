<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!--APP-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#06080c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumencraft">
<!--/APP-->
<title>Lumencraft</title>
<meta name="description" content="A Minecraft-style voxel sandbox in the browser with physically based sky, soft shadows, volumetric clouds, god rays and reflective water.">
<!--FONTS-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--/FONTS-->
<!--STYLES--><link rel="stylesheet" href="styles.css"><!--/STYLES-->
</head>
<body>
<!--BODY-->
<div id="app">
  <canvas id="view" tabindex="0" data-i18n-attr="aria-label:hud.gameView"></canvas>

  <div id="hud" hidden>
    <div class="crosshair" aria-hidden="true"></div>
    <pre id="debug" hidden></pre>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="blockname" aria-hidden="true"></div>
    <div id="hotbar" data-i18n-attr="aria-label:hud.hotbar"></div>
    <div id="lockhint" hidden data-i18n="hud.lockHint"></div>
  </div>

  <section id="title" class="screen" hidden>
    <div class="lang-toggle" role="group" data-i18n-attr="aria-label:title.language">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <div class="title-col">
      <p class="eyebrow" data-i18n="title.eyebrow"></p>
      <h1 class="logo">Lumencraft</h1>
      <p class="tagline" data-i18n="title.tagline"></p>
      <div class="menu">
        <button id="btn-play" class="btn primary" type="button" data-i18n="title.play"></button>
        <button id="btn-new" class="btn" type="button" data-i18n="title.new"></button>
        <button id="btn-settings" class="btn" type="button" data-i18n="title.settings"></button>
        <button id="btn-help" class="btn" type="button" data-i18n="title.help"></button>
        <button id="btn-device" class="btn subtle" type="button" data-i18n="title.device"></button>
      </div>
      <p class="meta" id="title-meta"></p>
    </div>
    <aside class="title-card" data-i18n-attr="aria-label:title.quickstart">
      <h2 data-i18n="title.quickstart"></h2>
      <dl class="keys" id="quick-keys"></dl>
    </aside>
  </section>

  <section id="pause" class="screen dim" hidden>
    <div class="sheet narrow">
      <h2 data-i18n="pause.title"></h2>
      <div class="menu">
        <button id="btn-resume" class="btn primary" type="button" data-i18n="pause.resume"></button>
        <button id="btn-pause-settings" class="btn" type="button" data-i18n="title.settings"></button>
        <button id="btn-pause-help" class="btn" type="button" data-i18n="title.help"></button>
        <button id="btn-title" class="btn" type="button" data-i18n="pause.toTitle"></button>
      </div>
    </div>
  </section>

  <section id="settings" class="screen dim" hidden>
    <div class="sheet wide">
      <header class="sheet-head">
        <h2 data-i18n="settings.title"></h2>
        <div class="tabs" role="tablist" id="settings-tabs"></div>
      </header>
      <div id="settings-body" class="settings-body"></div>
      <footer class="sheet-foot">
        <p class="hint" id="settings-hint" data-i18n="settings.hint"></p>
        <button id="btn-settings-done" class="btn primary" type="button" data-i18n="settings.done"></button>
      </footer>
    </div>
  </section>

  <section id="help" class="screen dim" hidden>
    <div class="sheet wide">
      <h2 data-i18n="help.title"></h2>
      <div id="help-body" class="help-body"></div>
      <div class="sheet-foot">
        <p class="hint" data-i18n="help.remote"></p>
        <button id="btn-help-done" class="btn primary" type="button" data-i18n="help.back"></button>
      </div>
    </div>
  </section>

  <section id="newworld" class="screen dim" hidden>
    <div class="sheet narrow">
      <h2 data-i18n="new.title"></h2>
      <p class="hint" data-i18n="new.hint"></p>
      <label class="field" for="seed-input">
        <span data-i18n="new.seed"></span>
        <input id="seed-input" type="text" inputmode="text" autocomplete="off" maxlength="40" data-i18n-attr="placeholder:new.placeholder">
      </label>
      <div class="menu row">
        <button id="btn-newworld-cancel" class="btn" type="button" data-i18n="new.cancel"></button>
        <button id="btn-newworld-create" class="btn primary" type="button" data-i18n="new.create"></button>
      </div>
    </div>
  </section>

  <section id="inventory" class="screen dim" hidden>
    <div class="sheet wide">
      <header class="sheet-head">
        <h2 data-i18n="inv.title"></h2>
        <p class="hint" data-i18n="inv.hint"></p>
      </header>
      <div id="inv-grid" class="inv-grid"></div>
      <div id="inv-hotbar" class="inv-hotbar"></div>
    </div>
  </section>

  <section id="device" class="screen dim" hidden>
    <div class="sheet">
      <h2 data-i18n="dev.title"></h2>
      <p class="hint" data-i18n="dev.hint"></p>
      <dl id="device-list" class="device-list"></dl>
      <div class="sheet-foot">
        <p class="hint" id="device-recommend"></p>
        <button id="btn-device-done" class="btn primary" type="button" data-i18n="dev.back"></button>
      </div>
    </div>
  </section>

  <div id="loading" hidden>
    <p class="loading-title" data-i18n="load.title"></p>
    <div class="bar"><div class="fill"></div></div>
    <p class="loading-sub" id="loading-sub" data-i18n="load.sub"></p>
  </div>

  <div id="error" hidden>
    <div class="sheet narrow">
      <h2 data-i18n="err.title"></h2>
      <p id="error-text"></p>
      <p class="hint" data-i18n="err.hint"></p>
      <dl id="error-device" class="device-list" hidden></dl>
    </div>
  </div>
</div>
<!--/BODY-->
<!--SCRIPT--><script type="module" src="src/main.js"></script><!--/SCRIPT-->
</body>
</html>
