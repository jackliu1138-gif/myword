<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!--APP-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#06080c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumencraft">
<!--/APP-->
<title>Lumencraft</title>
<meta name="description" content="A Minecraft-style voxel sandbox in the browser with physically based sky, soft shadows, volumetric clouds, god rays and reflective water.">
<!--FONTS-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--/FONTS-->
<!--STYLES--><link rel="stylesheet" href="styles.css"><!--/STYLES-->
</head>
<body>
<!--BODY-->
<div id="app">
  <canvas id="view" tabindex="0" data-i18n-attr="aria-label:hud.gameView"></canvas>
  <div id="hurt" aria-hidden="true"></div>
  <div id="portalfx" aria-hidden="true"></div>
  <div id="sleep" class="sleep" hidden>
    <div class="sleep-card">
      <p id="sleep-text" class="sleep-text" role="status" aria-live="polite"></p>
      <button id="btn-wake" class="btn" type="button" data-i18n="bed.leave"></button>
    </div>
  </div>

  <div id="hud" hidden>
    <div class="crosshair" aria-hidden="true"></div>
    <pre id="debug" hidden></pre>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="bossbar" class="bossbar" hidden>
      <span id="boss-name" class="boss-name"></span>
      <div class="boss-track" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="boss-fill"></i></div>
    </div>
    <div id="blockname" aria-hidden="true"></div>
    <div id="reentry" aria-hidden="true" hidden></div>
    <div id="space-hud" aria-hidden="true" hidden>
      <div id="space-marks"></div>
      <div id="space-info"><b id="space-alt"></b><span id="space-speed"></span></div>
    </div>
    <div id="vitals" hidden>
      <div class="vit-left">
        <div id="armorbar" class="armorbar" role="img" hidden></div>
        <div id="absorb" class="hearts gold" role="img" hidden></div>
        <div id="hearts" class="hearts" role="img"></div>
      </div>
      <div class="vit-right">
        <div id="bubbles" class="bubbles" role="img" hidden></div>
        <div id="food" class="food-bar" role="img"></div>
      </div>
    </div>
    <div id="xpbar" class="xpbar" hidden><span id="xp-level" class="xp-level"></span><div class="xp-track"><i id="xp-fill"></i></div></div>
    <div id="effects" class="effects"></div>
    <div id="hotbar" data-i18n-attr="aria-label:hud.hotbar"></div>
    <div id="lockhint" hidden data-i18n="hud.lockHint"></div>
    <div id="nametags" aria-hidden="true"></div>
    <div id="vbubbles" class="vbubbles" aria-hidden="true"></div>
    <div id="vtag" class="vtag" hidden aria-hidden="true"><b></b><span></span><em></em></div>
    <div id="voice-hud" class="voice-hud" hidden></div>
    <div id="chat" class="chat" hidden>
      <div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>
      <form id="chat-form" class="chat-form" hidden autocomplete="off">
        <input id="chat-input" type="text" maxlength="200" enterkeyhint="send" data-i18n-attr="placeholder:mp.chatPlaceholder;aria-label:mp.chat">
      </form>
    </div>
  </div>

  <section id="title" class="screen" hidden>
    <div class="lang-toggle" role="group" data-i18n-attr="aria-label:title.language">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <div class="title-col">
      <p class="eyebrow" data-i18n="title.eyebrow"></p>
      <h1 class="logo">Lumencraft</h1>
      <p class="tagline" data-i18n="title.tagline"></p>
      <div class="menu">
        <button id="btn-play" class="btn primary" type="button" data-i18n="title.play"></button>
        <button id="btn-worlds" class="btn" type="button" data-i18n="title.worlds"></button>
        <button id="btn-new" class="btn" type="button" data-i18n="title.new"></button>
        <button id="btn-multi" class="btn" type="button" data-i18n="title.multi"></button>
        <button id="btn-settings" class="btn" type="button" data-i18n="title.settings"></button>
        <button id="btn-help" class="btn" type="button" data-i18n="title.help"></button>
        <button id="btn-device" class="btn subtle" type="button" data-i18n="title.device"></button>
      </div>
      <p class="meta" id="title-meta"></p>
    </div>
    <aside class="title-card" data-i18n-attr="aria-label:title.quickstart">
      <h2 data-i18n="title.quickstart"></h2>
      <dl class="keys" id="quick-keys"></dl>
    </aside>
  </section>

  <section id="pause" class="screen dim" hidden>
    <div class="sheet narrow">
      <h2 data-i18n="pause.title"></h2>
      <div class="menu">
        <button id="btn-resume" class="btn primary" type="button" data-i18n="pause.resume"></button>
        <button id="btn-camera" class="btn" type="button"></button>
        <button id="btn-pause-settings" class="btn" type="button" data-i18n="title.settings"></button>
        <button id="btn-pause-help" class="btn" type="button" data-i18n="title.help"></button>
        <button id="btn-title" class="btn" type="button" data-i18n="pause.toTitle"></button>
      </div>
      <div id="mp-panel" class="mp-panel" hidden>
        <div class="mp-head"><span id="mp-server" class="mp-server"></span><span id="mp-ping" class="mp-ping"></span></div>
        <ul id="mp-players" class="mp-players"></ul>
        <div class="mp-voice">
          <button id="btn-mic" class="btn" type="button"></button>
          <div class="seg" id="voice-mode" role="group" data-i18n-attr="aria-label:set.voiceMode" style="--cols:2">
            <button type="button" data-v="proximity" data-i18n="voice.proximity"></button>
            <button type="button" data-v="global" data-i18n="voice.global"></button>
          </div>
        </div>
        <p class="hint" data-i18n="voice.hint"></p>
      </div>
    </div>
  </section>

  <section id="settings" class="screen dim" hidden>
    <div class="sheet wide">
      <header class="sheet-head">
        <h2 data-i18n="settings.title"></h2>
        <div class="tabs" role="tablist" id="settings-tabs"></div>
      </header>
      <div id="settings-body" class="settings-body"></div>
      <footer class="sheet-foot">
        <p class="hint" id="settings-hint" data-i18n="settings.hint"></p>
        <button id="btn-settings-done" class="btn primary" type="button" data-i18n="settings.done"></button>
      </footer>
    </div>
  </section>

  <section id="help" class="screen dim" hidden>
    <div class="sheet wide">
      <h2 data-i18n="help.title"></h2>
      <div id="help-body" class="help-body"></div>
      <div class="sheet-foot">
        <p class="hint" data-i18n="help.remote"></p>
        <button id="btn-help-done" class="btn primary" type="button" data-i18n="help.back"></button>
      </div>
    </div>
  </section>

  <section id="newworld" class="screen dim" hidden>
    <div class="sheet narrow">
      <h2 data-i18n="new.title"></h2>
      <p class="hint" data-i18n="new.hint"></p>
      <div class="field">
        <span data-i18n="new.mode"></span>
        <div class="seg" id="new-mode" role="group" data-i18n-attr="aria-label:new.mode" style="--cols:2">
          <button type="button" data-v="survival" aria-pressed="true" data-i18n="mode.survival"></button>
          <button type="button" data-v="creative" aria-pressed="false" data-i18n="mode.creative"></button>
        </div>
        <p class="desc" id="new-mode-desc" data-i18n="mode.survival.desc"></p>
      </div>
      <div class="field" id="new-diff-field">
        <span data-i18n="new.difficulty"></span>
        <div class="seg" id="new-diff" role="group" data-i18n-attr="aria-label:new.difficulty" style="--cols:4">
          <button type="button" data-v="peaceful" aria-pressed="false" data-i18n="diff.peaceful"></button>
          <button type="button" data-v="easy" aria-pressed="false" data-i18n="diff.easy"></button>
          <button type="button" data-v="normal" aria-pressed="true" data-i18n="diff.normal"></button>
          <button type="button" data-v="hard" aria-pressed="false" data-i18n="diff.hard"></button>
        </div>
      </div>
      <label class="field" for="name-input">
        <span data-i18n="new.name"></span>
        <input id="name-input" type="text" autocomplete="off" maxlength="32">
      </label>
      <label class="field" for="seed-input">
        <span data-i18n="new.seed"></span>
        <input id="seed-input" type="text" inputmode="text" autocomplete="off" maxlength="40" data-i18n-attr="placeholder:new.placeholder">
      </label>
      <div class="menu row">
        <button id="btn-newworld-cancel" class="btn" type="button" data-i18n="new.cancel"></button>
        <button id="btn-newworld-create" class="btn primary" type="button" data-i18n="new.create"></button>
      </div>
    </div>
  </section>

  <section id="worlds" class="screen dim" hidden>
    <div class="sheet narrow worlds-sheet">
      <header class="sheet-head">
        <h2 data-i18n="worlds.title"></h2>
        <p class="hint" data-i18n="worlds.hint"></p>
      </header>
      <div id="world-list" class="world-list" role="list"></div>
      <div class="menu row">
        <button id="btn-worlds-back" class="btn" type="button" data-i18n="worlds.back"></button>
        <button id="btn-worlds-new" class="btn primary" type="button" data-i18n="worlds.new"></button>
      </div>
    </div>
  </section>

  <section id="multiplayer" class="screen dim" hidden>
    <div class="sheet narrow">
      <h2 data-i18n="mp.title"></h2>
      <p class="hint" id="mp-hint" data-i18n="mp.hint"></p>
      <label class="field" for="mp-address">
        <span data-i18n="mp.address"></span>
        <input id="mp-address" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="200" data-i18n-attr="placeholder:mp.addressPlaceholder">
      </label>
      <label class="field" for="mp-name">
        <span data-i18n="mp.name"></span>
        <input id="mp-name" type="text" autocomplete="nickname" maxlength="16">
      </label>
      <label class="field" for="mp-password">
        <span data-i18n="mp.password"></span>
        <input id="mp-password" type="password" autocomplete="off" maxlength="64">
      </label>
      <p class="mp-error" id="mp-error" role="alert" hidden></p>
      <div class="menu row">
        <button id="btn-mp-cancel" class="btn" type="button" data-i18n="new.cancel"></button>
        <button id="btn-mp-join" class="btn primary" type="button" data-i18n="mp.join"></button>
      </div>
    </div>
  </section>

  <section id="inventory" class="screen dim" hidden>
    <div class="sheet wide inv-sheet">
      <header class="sheet-head">
        <h2 id="inv-title" data-i18n="inv.title"></h2>
        <p class="hint" id="inv-hint" data-i18n="inv.hint"></p>
        <button id="btn-inv-close" class="sheet-close" type="button" data-i18n-attr="aria-label:inv.close;title:inv.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      </header>
      <div class="inv-body">
        <div class="inv-player">
          <div class="inv-armor-col">
            <h3 class="inv-h" data-i18n="inv.armor"></h3>
            <div id="inv-armor" class="inv-armor"></div>
            <p class="inv-armor-pts" id="inv-armor-pts"></p>
          </div>
          <div class="inv-col inv-main">
            <h3 class="inv-h" data-i18n="inv.bag"></h3>
            <div id="inv-bag" class="bag-grid"></div>
            <div class="inv-hotrow">
              <div id="inv-hotbar" class="bag-grid inv-hotbar"></div>
            </div>
          </div>
        </div>
        <div class="inv-col inv-side">
          <div id="inv-creative" class="inv-creative" hidden>
            <div class="inv-tools">
              <div id="inv-tabs" class="inv-tabs" role="tablist"></div>
              <input id="inv-search" class="inv-search" type="search" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:inv.search; aria-label:inv.search">
            </div>
            <div id="inv-grid" class="inv-grid"></div>
            <button id="inv-trash" class="slot inv-trash" type="button" data-ref="trash"><span class="trash-glyph" aria-hidden="true"></span><span class="lbl" data-i18n="inv.trash"></span></button>
          </div>
          <div id="inv-survival" class="inv-survival" hidden>
            <h3 class="inv-h" data-i18n="inv.crafting"></h3>
            <div id="inv-recipes" class="recipe-list"></div>
          </div>
          <div id="inv-container" class="inv-container" hidden>
            <h3 class="inv-h" id="inv-cont-title"></h3>
            <div id="inv-chest" class="bag-grid inv-chest"></div>
            <div id="inv-furnace" class="furnace-ui" hidden>
              <div class="fur-left">
                <div id="fur-input" class="bag-grid fur-slot"></div>
                <div class="fur-flame" aria-hidden="true"><i id="fur-flame"></i></div>
                <div id="fur-fuel" class="bag-grid fur-slot"></div>
              </div>
              <div class="fur-arrow" aria-hidden="true"><i id="fur-arrow"></i></div>
              <div id="fur-output" class="bag-grid fur-slot fur-out"></div>
            </div>
            <div id="inv-enchant" class="enchant-ui" hidden>
              <div class="ench-slots">
                <div id="ench-item" class="bag-grid fur-slot"></div>
                <div id="ench-lapis" class="bag-grid fur-slot"></div>
              </div>
              <div id="ench-offers" class="ench-offers"></div>
            </div>
            <div id="inv-brewing" class="brewing-ui" hidden>
              <div class="brew-top">
                <div class="brew-fuelcol">
                  <div id="brew-fuel" class="bag-grid fur-slot"></div>
                  <div class="brew-fuelbar" aria-hidden="true"><i id="brew-fuelbar"></i></div>
                </div>
                <div class="brew-mid">
                  <div id="brew-ing" class="bag-grid fur-slot"></div>
                  <div class="brew-progress" aria-hidden="true"><i id="brew-progress"></i></div>
                </div>
              </div>
              <div id="brew-bottles" class="bag-grid brew-bottles"></div>
            </div>
            <div id="inv-trade" class="trade-ui" hidden>
              <div id="trade-offers" class="trade-offers" role="list"></div>
            </div>
            <p class="hint" id="inv-cont-hint"></p>
          </div>
        </div>
      </div>
    </div>
    <div id="inv-cursor" class="inv-cursor" hidden><img alt=""><span class="count"></span></div>
  </section>

  <section id="talk" class="screen talk-screen" hidden>
    <div class="sheet talk-sheet" role="dialog" aria-labelledby="talk-name">
      <header class="talk-head">
        <div class="talk-who">
          <h2 id="talk-name"></h2>
          <p class="hint" id="talk-job"></p>
        </div>
        <div id="talk-hearts" class="talk-hearts" role="img"></div>
        <button id="btn-talk-close" class="sheet-close" type="button" data-i18n-attr="aria-label:inv.close;title:inv.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      </header>
      <div id="talk-log" class="talk-log" role="log" aria-live="polite"></div>
      <div id="talk-quest" class="talk-quest" hidden>
        <p id="talk-quest-text" class="tq-text"></p>
        <button id="btn-talk-deliver" class="btn primary" type="button" data-i18n="talk.deliver"></button>
      </div>
      <div id="talk-chips" class="talk-chips"></div>
      <form id="talk-form" class="talk-form" autocomplete="off">
        <button id="btn-talk-mic" class="talk-mic" type="button" hidden data-i18n-attr="aria-label:talk.mic;title:talk.mic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
        <input id="talk-input" type="text" maxlength="200" enterkeyhint="send" autocomplete="off" data-i18n-attr="placeholder:talk.placeholder;aria-label:talk.placeholder">
        <button id="btn-talk-send" class="btn primary" type="submit" data-i18n="talk.send"></button>
      </form>
      <footer class="talk-foot">
        <button id="btn-talk-gift" class="btn subtle" type="button"></button>
        <button id="btn-talk-trade" class="btn subtle" type="button" data-i18n="talk.trade"></button>
        <span id="talk-brain" class="talk-brain"></span>
      </footer>
    </div>
  </section>

  <section id="signedit" class="screen dim" hidden>
    <div class="sheet narrow sign-sheet">
      <header class="sheet-head">
        <h2 data-i18n="sign.title"></h2>
        <p class="hint" data-i18n="sign.hint"></p>
      </header>
      <div class="sign-board">
        <input class="sign-line" type="text" maxlength="18" autocomplete="off" spellcheck="false" data-i18n-attr="aria-label:sign.line">
        <input class="sign-line" type="text" maxlength="18" autocomplete="off" spellcheck="false" data-i18n-attr="aria-label:sign.line">
        <input class="sign-line" type="text" maxlength="18" autocomplete="off" spellcheck="false" data-i18n-attr="aria-label:sign.line">
        <input class="sign-line" type="text" maxlength="18" autocomplete="off" spellcheck="false" data-i18n-attr="aria-label:sign.line">
      </div>
      <div class="menu">
        <button id="btn-sign-done" class="btn primary" type="button" data-i18n="sign.done"></button>
      </div>
    </div>
  </section>

  <section id="death" class="screen death" hidden>
    <div class="sheet narrow">
      <h2 data-i18n="death.title"></h2>
      <p class="death-cause" id="death-cause"></p>
      <p class="hint" data-i18n="death.note"></p>
      <div class="menu">
        <button id="btn-respawn" class="btn primary" type="button" data-i18n="death.respawn"></button>
        <button id="btn-death-title" class="btn" type="button" data-i18n="pause.toTitle"></button>
      </div>
    </div>
  </section>

  <section id="device" class="screen dim" hidden>
    <div class="sheet">
      <h2 data-i18n="dev.title"></h2>
      <p class="hint" data-i18n="dev.hint"></p>
      <dl id="device-list" class="device-list"></dl>
      <div class="sheet-foot">
        <p class="hint" id="device-recommend"></p>
        <button id="btn-device-done" class="btn primary" type="button" data-i18n="dev.back"></button>
      </div>
    </div>
  </section>

  <div id="loading" hidden>
    <p class="loading-title" data-i18n="load.title"></p>
    <div class="bar"><div class="fill"></div></div>
    <p class="loading-sub" id="loading-sub" data-i18n="load.sub"></p>
  </div>

  <div id="error" hidden>
    <div class="sheet narrow">
      <h2 data-i18n="err.title"></h2>
      <p id="error-text"></p>
      <p class="hint" data-i18n="err.hint"></p>
      <dl id="error-device" class="device-list" hidden></dl>
    </div>
  </div>
</div>
<!--/BODY-->
<!--SCRIPT--><script type="module" src="src/main.js"></script><!--/SCRIPT-->
</body>
</html>
